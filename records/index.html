<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archive — Outer Chord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
  /* The song archive: every song make chord has made, newest first.
     A first pass on the layout — a record half off the left edge with a
     thin red ring for progress, a large title, and the track list — meant
     to be replaced by a proper design later; the data and the playback
     underneath do not change with it. */
  :root{
    --paper:#f1eee7; --ink:#141414; --muted:#8a877f; --line:rgba(20,20,20,.12); --red:#b01d12;
    /* Hangul falls through to Pretendard rather than a system monospace */
    --mono:'IBM Plex Mono', 'Pretendard Variable', Pretendard, ui-monospace, monospace;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--paper); color:var(--ink);
    font-family:'Pretendard Variable', Pretendard, 'Inter', sans-serif; -webkit-font-smoothing:antialiased; }
  body{ overflow:hidden; }

  .app{ position:fixed; inset:0; display:grid; grid-template-columns: 46% 54%; }

  /* ---------- top bar ---------- */
  .top{ position:fixed; left:0; right:0; top:0; z-index:5; height:64px;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 clamp(20px, 3vw, 48px) 0 clamp(76px, 6.4vw, 110px); pointer-events:none; }
  .brand{ font:600 13px/1 'Inter', sans-serif; letter-spacing:.06em; }
  .nav{ display:flex; gap:22px; pointer-events:auto; }
  .nav a{ font:500 11px/1 'Inter', sans-serif; letter-spacing:.12em; text-transform:uppercase; color:var(--ink); text-decoration:none; }
  .nav a:hover{ color:var(--red); }

  /* ---------- the record ---------- */
  .deck{ position:relative; overflow:hidden; }
  .deck canvas{ position:absolute; left:0; top:0; width:100%; height:100%; display:block; }
  .now{ position:absolute; left:50%; bottom:clamp(20px, 5vh, 48px); transform:translateX(-50%);
    font:400 12px/1 var(--mono); color:var(--ink); white-space:nowrap; }
  .now .total{ color:var(--muted); }

  /* ---------- the list ---------- */
  .side{ display:flex; flex-direction:column; min-height:0;
    padding:clamp(80px, 12vh, 120px) clamp(20px, 3vw, 48px) clamp(20px, 4vh, 40px) clamp(10px, 2vw, 40px); }
  .side h1{ margin:0; font:800 clamp(56px, 8.6vw, 150px)/.86 'Inter', sans-serif; letter-spacing:-.045em; text-transform:uppercase; }
  .tags{ margin-top:14px; font:500 11px/1.6 var(--mono); letter-spacing:.06em; text-transform:uppercase; }
  .label{ margin:clamp(18px, 4vh, 36px) 0 10px; font:600 13px/1 'Inter', sans-serif; letter-spacing:.04em; color:var(--red); text-transform:uppercase; }
  .list{ list-style:none; margin:0; padding:0; overflow-y:auto; min-height:0; flex:1;
    border-top:1px solid var(--line); scrollbar-width:thin; }
  .row{ display:grid; grid-template-columns: 30px 44px 1fr auto; align-items:center; gap:14px;
    padding:9px 4px; border-bottom:1px solid var(--line); cursor:pointer; }
  .row:hover{ background:rgba(20,20,20,.035); }
  .row:focus-visible{ outline:2px solid var(--red); outline-offset:-2px; }
  .row .no{ font:400 11px/1 var(--mono); color:var(--muted); }
  .row.is-on .no{ color:var(--red); }
  .row canvas{ width:44px; height:44px; display:block; }
  .row .t{ font:500 12.5px/1.3 var(--mono); letter-spacing:.02em; text-transform:uppercase; }
  .row .s{ font:400 11px/1.4 var(--mono); color:var(--muted); text-transform:uppercase; }
  .row .d{ font:400 12px/1 var(--mono); }
  .controls{ display:flex; gap:10px; justify-content:flex-end; margin-top:14px; flex-wrap:wrap; }
  .controls button{ appearance:none; border:1px solid var(--ink); background:transparent; color:var(--ink);
    border-radius:999px; padding:11px 18px; cursor:pointer; font:500 11px/1 'Inter', sans-serif; letter-spacing:.14em; text-transform:uppercase; }
  .controls button.primary{ background:var(--ink); color:var(--paper); }
  .controls button:hover:not(:disabled), .controls button:focus-visible{ background:var(--red); border-color:var(--red); color:var(--paper); outline:none; }
  .controls button:disabled{ opacity:.3; cursor:default; }
  .empty{ padding:24px 4px; font-size:14px; line-height:1.8; color:var(--muted); }

  @media (max-width: 820px){
    body{ overflow:auto; }
    /* the bar sits above the record instead of over it */
    .top{ position:static; height:60px; padding-left:64px; }
    .brand{ display:none; }
    .app{ position:static; display:block; }
    .deck{ height:96vw; }
    .now{ bottom:6px; }
    .side{ padding:20px 16px 28px; }
    .list{ overflow:visible; }
  }
</style>
</head>
<body>

<div class="top">
  <div class="brand">OUTER CHORD</div>
  <nav class="nav">
    <a href="../index.html">Main</a>
    <a href="../chord/index.html">Make Chord</a>
  </nav>
</div>

<div class="app">
  <section class="deck" aria-label="선택한 곡의 레코드">
    <canvas id="deck"></canvas>
    <div class="now"><span id="tNow">0:00</span> / <span class="total" id="tTotal">0:00</span></div>
  </section>

  <section class="side">
    <h1>Outer<br>Chord</h1>
    <div class="tags" id="tags">성간 미아를 위한 불협화음 — archive</div>
    <div class="label">Recent</div>
    <ul class="list" id="list" aria-label="만들어진 곡 목록"></ul>
    <div class="controls">
      <button type="button" class="primary" id="playBtn" disabled>▶ Play</button>
      <button type="button" id="saveBtn" disabled>⤓ WAV</button>
      <button type="button" id="qrBtn" disabled>▦ QR</button>
    </div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="../shared/outer-chord.js"></script>
<script>
(function(){
'use strict';
const OC = window.OuterChord;
const $ = id => document.getElementById(id);
const deck = $('deck'), g = deck.getContext('2d');
let tracks = [], current = null, player = null, spin = 0, dpr = 1, W = 0, H = 0;

const pad2 = n => String(n).padStart(2, '0');
const when = iso => { const d = new Date(iso); return isNaN(d) ? '' : `${d.getFullYear()}.${pad2(d.getMonth() + 1)}.${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };

/* ---------------- the deck ---------------- */
function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const r = deck.getBoundingClientRect(); W = r.width; H = r.height;
  deck.width = Math.round(W * dpr); deck.height = Math.round(H * dpr);
}
function drawDeck(){
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  // phone layout (the same breakpoint as the CSS): the whole disc, centred
  const narrow = window.matchMedia('(max-width: 820px)').matches;
  // on a phone the whole disc is shown, with room under it for the time
  const R = narrow ? H * .38 : Math.min(H * .4, W * .78);
  const cx = narrow ? W / 2 : 0, cy = H / 2;
  const now = player && player.playing ? player.time() : -1;
  const song = current && current.song;

  // the thin red ring and its progress dot, a step outside the disc
  const ringR = R * 1.08;
  g.lineWidth = 1; g.strokeStyle = 'rgba(176,29,18,.55)';
  g.beginPath(); g.arc(cx, cy, ringR, 0, Math.PI * 2); g.stroke();
  const p = song && now >= 0 ? Math.min(1, now / song.length) : 0;
  // the dot goes once round the ring — or, when only the right half of the
  // disc is on screen, down the part of it in plain view, from upper right
  // to lower right (clear of the corners and the back arrow)
  const da = narrow ? -Math.PI / 2 + p * Math.PI * 2 : -Math.PI / 3 + p * Math.PI * 2 / 3;
  g.fillStyle = '#f1eee7'; g.strokeStyle = '#b01d12'; g.lineWidth = 1.5;
  g.beginPath(); g.arc(cx + Math.cos(da) * ringR, cy + Math.sin(da) * ringR, 6, 0, Math.PI * 2); g.fill(); g.stroke();
  g.fillStyle = '#b01d12';
  g.beginPath(); g.arc(cx + Math.cos(da) * ringR, cy + Math.sin(da) * ringR, 2.4, 0, Math.PI * 2); g.fill();

  OC.drawRecord(g, cx, cy, R, song, now, {
    spin, tonearm: false, restAlpha: .5,
    labelText: current ? ['№ ' + pad2(current.no), OC.fmt(song.length)] : ['OUTER', 'CHORD'],
  });

  $('tNow').textContent = OC.fmt(Math.max(0, now));
  $('tTotal').textContent = song ? OC.fmt(song.length) : '0:00';
}
let next = 0;
function loop(ts){
  if (ts >= next) {
    next = ts + (1000 / 24) * (1 + (Math.random() * 2 - 1) * .15);
    if (!(player && player.playing)) spin += .006;
    drawDeck();
  }
  requestAnimationFrame(loop);
}

/* ---------------- the list ---------------- */
function cover(canvas, song){
  const s = 44, r = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = canvas.height = s * r;
  const c = canvas.getContext('2d'); c.setTransform(r, 0, 0, r, 0, 0);
  OC.drawRecord(c, s / 2, s / 2, s / 2, song, -1, { labelText: false, restAlpha: .9 });
}

function select(t){
  if (player) player.stop();
  current = t;
  player = OC.player(t.song, () => { $('playBtn').textContent = '▶ Play'; });
  $('playBtn').textContent = '▶ Play';
  document.querySelectorAll('.row').forEach(r => r.classList.toggle('is-on', r.dataset.id === t.id));
  ['playBtn', 'saveBtn', 'qrBtn'].forEach(id => ($(id).disabled = false));
}

async function load(){
  const { from, songs } = await OC.listSongs('../');
  // oldest is №01; the list shows the newest first
  songs.sort((a, b) => String(a.createdAt).localeCompare(String(b.createdAt)));
  const ready = [];
  for (let i = 0; i < songs.length; i++) {
    const s = songs[i];
    try { const compact = await OC.decode(s.code); ready.push({ ...s, no: i + 1, song: OC.expand(compact) }); }
    catch (err) { /* an unreadable entry is skipped, not fatal */ }
  }
  tracks = ready.reverse();
  $('tags').textContent = `성간 미아를 위한 불협화음 — ${tracks.length} tracks · ${from === 'server' ? '전시 서버' : '이 브라우저'}`;

  const list = $('list');
  if (!tracks.length) { list.innerHTML = '<li class="empty">아직 만들어진 곡이 없습니다.<br>작품을 체험하고 make chord에서 곡을 만들어 보세요.</li>'; return; }
  list.innerHTML = '';
  for (const t of tracks) {
    const li = document.createElement('li');
    li.className = 'row'; li.tabIndex = 0; li.dataset.id = t.id;
    li.innerHTML = `<span class="no">${pad2(t.no)}</span><canvas aria-hidden="true"></canvas>
      <span><div class="t">${OC.chordName(t.song.barInfo[0].chord)}</div>
      <div class="s">${when(t.createdAt)}${t.sessions ? ` · 체험 ${t.sessions}회` : ''}</div></span>
      <span class="d">${OC.fmt(t.song.length)}</span>`;
    cover(li.querySelector('canvas'), t.song);
    li.addEventListener('click', () => select(t));
    li.addEventListener('dblclick', () => { select(t); play(); });
    li.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(t); play(); } });
    list.appendChild(li);
  }
  select(tracks[0]);
}

function play(){ if (!player) return; player.play(); $('playBtn').textContent = '■ Stop'; }
$('playBtn').addEventListener('click', () => {
  if (!player) return;
  if (player.playing) { player.stop(); $('playBtn').textContent = '▶ Play'; } else play();
});
$('saveBtn').addEventListener('click', async () => {
  if (!current) return;
  const b = $('saveBtn'); b.disabled = true; const l = b.textContent; b.textContent = '…';
  try { OC.download(await OC.renderWav(current.song), `outer-chord-${pad2(current.no)}.wav`); } catch (err) { alert('파일을 만들지 못했습니다: ' + err.message); }
  b.textContent = l; b.disabled = false;
});
$('qrBtn').addEventListener('click', () => {
  if (!current) return;
  OC.showQR(current.code, { title: `№ ${pad2(current.no)} — ${OC.chordName(current.song.barInfo[0].chord)}` });
});

window.addEventListener('resize', resize);
resize();
requestAnimationFrame(loop);
load();
})();
</script>
<script src="../shared/back.js" data-visit="0" data-color="#141414"></script>
</body>
</html>
