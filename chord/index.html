<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Make Chord — Outer Chord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
  :root{
    --bg:#191818;
    --ink:#e8e2d4;
    --muted:rgba(232,226,212,0.55);
    --faint:rgba(232,226,212,0.16);
    --red:#b01d12;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{
    margin:0; width:100%; height:100%; overflow:hidden;
    background:var(--bg); color:var(--ink);
    font-family:'Pretendard Variable', Pretendard, 'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .backdrop{
    position:fixed; inset:0; pointer-events:none;
    background:var(--bg) url('../main-assets/background.jpg') center / cover no-repeat;
    opacity:.45;
  }

  /* the record, as large as the window allows */
  .stage{
    position:fixed; inset:0;
    display:grid; place-items:center;
  }
  canvas{ display:block; }

  /* ---------- info, top right ---------- */
  .info{
    position:fixed; right:clamp(20px, 3vw, 56px); top:clamp(20px, 5vh, 52px);
    text-align:right; z-index:5;
    max-width:min(360px, 42vw);
  }
  .info h1{
    margin:0;
    font-family:'Playfair Display', serif; font-style:italic; font-weight:500;
    font-size:clamp(22px, 2.2vw, 38px); line-height:1.1;
  }
  .info .sub{
    margin-top:6px; font-size:12px; letter-spacing:.3em; color:var(--muted);
  }
  .legend{
    list-style:none; margin:22px 0 0; padding:0;
    font-family:'Inter', sans-serif; font-size:12px; line-height:2.05;
    color:var(--muted);
  }
  .legend li{ display:flex; justify-content:flex-end; align-items:center; gap:10px; }
  .legend .n{ color:var(--ink); min-width:3.2em; text-align:right; font-variant-numeric:tabular-nums; }
  .legend .dot{ width:8px; height:8px; border-radius:50%; flex:none; }
  .legend li.off{ opacity:.35; }
  .stats{
    margin-top:14px; padding-top:12px; border-top:1px solid var(--faint);
    font-family:'Inter', sans-serif; font-size:11px; letter-spacing:.08em; color:var(--muted);
    line-height:1.8;
  }

  /* ---------- now playing, bottom left ---------- */
  .now{
    position:fixed; left:clamp(20px, 3vw, 56px); bottom:clamp(20px, 5vh, 52px);
    z-index:5; font-family:'Inter', sans-serif;
  }
  .now .label{ font-size:11px; letter-spacing:.2em; color:var(--muted); text-transform:uppercase; }
  .now .chord{
    margin-top:8px;
    font-family:'Playfair Display', serif; font-size:clamp(28px, 3.2vw, 54px); line-height:1;
    min-height:1em;
  }
  .now .bar{ margin-top:10px; font-size:11px; letter-spacing:.2em; color:var(--muted); font-variant-numeric:tabular-nums; }

  /* ---------- controls, bottom right ---------- */
  .controls{
    position:fixed; right:clamp(20px, 3vw, 56px); bottom:clamp(20px, 5vh, 52px);
    z-index:5; display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end;
    max-width:60vw;
  }
  .controls button{
    appearance:none; border:1px solid var(--ink); background:transparent; color:var(--ink);
    font:500 12px/1 'Inter', sans-serif; letter-spacing:.16em; text-transform:uppercase;
    padding:13px 18px; border-radius:999px; cursor:pointer;
    transition:background .2s steps(3, end), color .2s steps(3, end);
  }
  .controls button:hover:not(:disabled),
  .controls button:focus-visible{ background:var(--ink); color:var(--bg); outline:none; }
  .controls button.primary{ background:var(--red); border-color:var(--red); color:var(--ink); }
  .controls button.primary:hover:not(:disabled){ background:var(--ink); border-color:var(--ink); color:var(--bg); }
  .controls button:disabled{ opacity:.3; cursor:default; }

  .message{
    position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
    z-index:6; text-align:center; max-width:80vw;
    font-size:15px; line-height:1.9; color:var(--ink);
    background:rgba(25,24,24,.82); padding:22px 30px; border-radius:6px;
  }
  .message[hidden]{ display:none; }

  @media (max-width: 720px){
    .info{ max-width:60vw; }
    .legend{ font-size:11px; }
    .controls{ left:16px; right:16px; max-width:none; justify-content:center; }
    .now{ bottom:auto; top:auto; left:16px; bottom:96px; }
  }
</style>
</head>
<body>

<div class="backdrop" aria-hidden="true"></div>

<div class="stage"><canvas id="record" aria-label="지금까지 모인 소리로 만든 음악의 레코드"></canvas></div>

<aside class="info">
  <h1>Make Chord</h1>
  <div class="sub">성간 미아를 위한 불협화음</div>
  <ul class="legend" id="legend"></ul>
  <div class="stats" id="stats">소리를 모으는 중…</div>
</aside>

<div class="now" aria-live="polite">
  <div class="label">Chord</div>
  <div class="chord" id="chordName">—</div>
  <div class="bar" id="barCount"></div>
</div>

<div class="controls">
  <button type="button" class="primary" id="playBtn" disabled>▶ 재생</button>
  <button type="button" id="remakeBtn" disabled>↻ 다시 만들기</button>
  <button type="button" id="saveBtn" disabled>⤓ WAV 저장</button>
  <button type="button" id="qrBtn" disabled>▦ QR로 받기</button>
  <button type="button" id="archiveBtn" disabled>≡ 아카이브</button>
</div>

<div class="message" id="message" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="../shared/outer-chord.js"></script>

<script>
(function(){
'use strict';

/* =====================================================================
   1. Where the sounds come from
   ===================================================================== */
// the synth, the record, the song format and the archive live in
// shared/outer-chord.js, which the phone page and the archive use too
const OC = window.OuterChord;
const { SOURCES, ORDER, BPM, BEAT, BAR, STEPS, STEP, NAMES, clamp, fold } = OC;

const hz2midi = f => 69 + 12 * Math.log2(f / 440);
const num = (v, d) => (typeof v === 'number' && isFinite(v) ? v : d);

/* Every piece logs in its own shape; they all come out of here as
     { src, time (ms), kind: 'tone' | 'kick' | 'tick' | 'wash',
       midi, dur (s), vel (0..1), pan (-1..1) | null, sess }
   or null for things that were not a sound (mute toggles, page start...). */
const tone = (src, time, midi, dur, vel, pan, sess) =>
  isFinite(midi) && midi > 0 ? { src, time, kind: 'tone', midi, dur: clamp(num(dur, .4), .05, 6), vel: clamp(num(vel, .5), .02, 1), pan, sess } : null;
const hit = (src, time, kind, vel, pan, sess) => ({ src, time, kind, vel: clamp(num(vel, .5), .05, 1), pan, sess });

const NORMALIZE = {
  cattle(e){
    const time = num(e.t, num(e.st, 0)), sess = e.s;
    const pan = e.x != null ? clamp(e.x / 960 - 1, -1, 1) : null;
    const vel = num(e.v, e.by === 'human' ? .75 : .45);
    switch (e.type) {
      case 'heartbeat': return hit('cattle', time, 'kick', .8, 0, sess);
      case 'drop': case 'vessel-flood': case 'beam-noise': case 'capture':
        return hit('cattle', time, 'wash', .5, pan, sess);
      case 'audio-start': return null;
    }
    return e.f > 0 ? tone('cattle', time, hz2midi(e.f), e.d, vel, pan, sess) : null;
  },
  e(e, sessionStart){
    const time = sessionStart + num(e.t, 0), sess = e.session;
    switch (e.type) {
      case 'note':  return tone('e', time, e.midi, num(e.dur, 400) / 1000, e.vel, null, sess);
      case 'heart': return hit('e', time, 'kick', e.strong ? .9 : .6, 0, sess);
      case 'glass': return hit('e', time, 'tick', .6, null, sess);
      case 'shatter': return hit('e', time, 'wash', .8, null, sess);
    }
    return null;
  },
  d(e){
    const time = num(e.ts, Date.parse(e.iso) || 0), sess = e.session;
    const pan = e.x != null ? clamp(e.x * 2 - 1, -1, 1) : null;
    if (e.src === 'mute' || e.src === 'unmute') return null;
    if (e.src === 'pulse') return hit('d', time, 'kick', .5, pan, sess);
    return e.freq > 0 ? tone('d', time, e.midi || hz2midi(e.freq), e.dur, e.vel * 3, pan, sess) : null;
  },
  imnota(e){
    const time = num(e.t, Date.parse(e.rt) || 0), sess = e.s;
    switch (e.type) {
      case 'note': return tone('imnota', time, e.midi, e.dur, .6, null, sess);
      case 'hum': case 'inhale': return hit('imnota', time, 'wash', .4, null, sess);
      case 'crunch': case 'pass': case 'error': return hit('imnota', time, 'tick', .5, null, sess);
    }
    return null;
  },
  tenshi(e, sessionStart, sess){
    const time = sessionStart + num(e.t, 0);
    const pan = e.x != null ? clamp(e.x * 2 - 1, -1, 1) : null;
    if (e.f > 0) return tone('tenshi', time, hz2midi(e.f), e.dur, e.vel, pan, sess);
    if (e.type === 'flood') return hit('tenshi', time, 'wash', .45, pan, sess);
    return e.type ? hit('tenshi', time, 'tick', .35, pan, sess) : null;
  },
};

/* The server copy is the whole archive, so it wins whenever it answers.
   Opened as a plain file, or on static hosting with no server behind it,
   each piece falls back to what it kept in this browser. */
const onServer = location.protocol.startsWith('http');

async function getJSON(url){
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 6000);
  try {
    const r = await fetch(url, { cache: 'no-store', signal: ctl.signal });
    if (!r.ok) throw new Error(r.status);
    return await r.text();
  } finally { clearTimeout(timer); }
}
const lines = text => text.split('\n').filter(l => l.trim()).map(l => { try { return JSON.parse(l); } catch (_) { return null; } }).filter(Boolean);
const local = key => { try { return JSON.parse(localStorage.getItem(key)); } catch (_) { return null; } };

const LOADERS = {
  async cattle(){
    if (onServer) try { return { from: 'server', raw: JSON.parse(await getJSON('../cattlemutilation/api/sounds?since=0&limit=100000000')) }; } catch (_) {}
    return { from: 'local', raw: local('cattle-mutilation-sound-pending-v1') || [] };
  },
  async e(){
    if (onServer) try { return { from: 'server', raw: JSON.parse(await getJSON('../e/api/sounds')) }; } catch (_) {}
    const sessions = local('drawn-groove/v1:memory') || [];
    return { from: 'local', raw: sessions.flatMap(s => (s.events || []).map(ev => ({ ...ev, session: s.session }))) };
  },
  async d(){
    if (onServer) try { return { from: 'server', raw: JSON.parse(await getJSON('../d/api/sounds?date=all')) }; } catch (_) {}
    return { from: 'local', raw: local('noctiluca.soundlog.v1') || [] };
  },
  async imnota(){
    if (onServer) try {
      const dates = JSON.parse(await getJSON('../imnota/api/sounds/dates'));
      const days = await Promise.all(dates.map(d => getJSON('../imnota/api/sounds/' + d).then(lines)));
      return { from: 'server', raw: days.flat() };
    } catch (_) {}
    return { from: 'local', raw: local('notalien.soundmem') || [] };
  },
  async tenshi(){
    if (onServer) try {
      const raw = lines(await getJSON('../tenshi/memory')).map(l => l.data).filter(Boolean);
      return { from: 'server', raw, grouped: true };
    } catch (_) {}
    const store = local('tenshi.memory.v1');
    return { from: 'local', raw: (store && store.sessions) || [], grouped: true };
  },
};

async function collect(){
  const all = [], info = {};
  await Promise.all(ORDER.map(async key => {
    let got;
    try { got = await LOADERS[key](); } catch (_) { got = { from: 'none', raw: [] }; }
    const out = [];
    const raw = Array.isArray(got.raw) ? got.raw : [];
    if (key === 'tenshi') {
      // one entry per upload (server) or per visit (local): {session|id, start, events}
      for (const g of raw) {
        const s = g.session || g;
        const start = Date.parse(s.start) || 0;
        for (const ev of g.events || []) { const n = NORMALIZE.tenshi(ev, start, s.id); if (n) out.push(n); }
      }
    } else if (key === 'e') {
      for (const ev of raw) { const n = NORMALIZE.e(ev, Date.parse(ev.session) || 0); if (n) out.push(n); }
    } else {
      for (const ev of raw) { const n = ev && NORMALIZE[key](ev); if (n) out.push(n); }
    }
    info[key] = { from: got.from, count: out.length };
    all.push(...out);
  }));
  all.sort((a, b) => a.time - b.time);
  return { events: all, info };
}

/* =====================================================================
   2. Composing: the archive, read front to back, becomes a row of bars
   The result is the compact song (see shared/outer-chord.js): every value
   already rounded to what the phone page and the archive will decode, so
   the song played here is exactly the one that leaves in the QR code.
   ===================================================================== */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
// n roughly equal, chronological slices of a list
function slices(list, n){
  const out = [];
  for (let i = 0; i < n; i++) out.push(list.slice(Math.floor(i * list.length / n), Math.floor((i + 1) * list.length / n)));
  return out;
}
// pick up to k items, keeping their order
function sample(list, k, rnd){
  if (list.length <= k) return list.slice();
  const idx = new Set();
  while (idx.size < k) idx.add(Math.floor(rnd() * list.length));
  return [...idx].sort((a, b) => a - b).map(i => list[i]);
}

function compose(events, seed){
  const rnd = mulberry32(seed);
  const tones = events.filter(e => e.kind === 'tone');
  const hits = events.filter(e => e.kind !== 'tone');
  if (!tones.length && !hits.length) return null;

  const bars = clamp(Math.round(Math.sqrt(tones.length || hits.length) * 1.6), 8, 32);
  const toneGroups = slices(tones, bars);
  const hitGroups = slices(hits, bars);
  const c = { v: 1, bars, chords: [], mel: [], dr: [] };
  let chord = [0, 4, 7];   // only used if the archive opens with silence

  for (let b = 0; b < bars; b++) {
    const group = toneGroups[b];

    // --- the chord: the pitch classes that sounded most in this stretch ---
    if (group.length) {
      const w = new Array(12).fill(0);
      for (const e of group) w[((Math.round(e.midi) % 12) + 12) % 12] += e.vel * (0.5 + Math.min(e.dur, 2));
      const top = w.map((v, pc) => [v, pc]).filter(x => x[0] > 0).sort((a, b) => b[0] - a[0]).slice(0, 3).map(x => x[1]);
      if (top.length) chord = top;
    }
    c.chords.push(chord.slice());

    // --- the melody: the actual sounds, in the order they were made ---
    const picked = sample(group, 12, rnd);
    c.mel.push(picked.map((e, i) => {
      let step = Math.floor(i * STEPS / picked.length);
      if (rnd() < .3) step = Math.min(STEPS - 1, step + 1);
      const steps = clamp(Math.round(e.dur / STEP), 1, 8);
      const pan = e.pan != null ? e.pan : (rnd() * 2 - 1) * .75;
      return [step, fold(Math.round(e.midi), 55, 88), steps, OC.q7(e.vel), ORDER.indexOf(e.src), OC.qPan(pan)];
    }));

    // --- percussion: heartbeats land on the beat, glass on the offbeats ---
    c.dr.push(sample(hitGroups[b], 8, rnd).map((e, i, arr) => {
      let step = Math.floor(i * STEPS / arr.length);
      if (e.kind === 'kick') step = Math.round(step / 4) * 4 % STEPS;
      else if (e.kind === 'tick') step = (Math.floor(step / 2) * 2 + 2) % STEPS;
      else step = step < 8 ? 0 : 8;
      return [step, OC.KINDS.indexOf(e.kind), OC.qHit(e.vel), OC.qPan(e.pan != null ? e.pan : 0)];
    }));
  }
  return c;
}

/* =====================================================================
   3. The record
   ===================================================================== */
const canvas = document.getElementById('record');
const g2 = canvas.getContext('2d');
let R = 100, dpr = 1;

function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const size = Math.floor(Math.min(window.innerWidth * .62, window.innerHeight * .84));
  R = size / 2;
  canvas.style.width = canvas.style.height = size + 'px';
  canvas.width = canvas.height = Math.floor(size * dpr);
  draw();
}

function draw(){
  const size = canvas.width / dpr;
  g2.setTransform(dpr, 0, 0, dpr, 0, 0);
  g2.clearRect(0, 0, size, size);
  // the arm reaches in from outside the disc, so the disc sits a touch in
  OC.drawRecord(g2, size / 2, size / 2, R, song, player && player.playing ? player.time() : -1,
                { spin: idleSpin, tonearm: true, restAlpha: .32 });
}

/* =====================================================================
   4. Page
   ===================================================================== */
const $ = id => document.getElementById(id);
const playBtn = $('playBtn'), remakeBtn = $('remakeBtn'), saveBtn = $('saveBtn'),
      qrBtn = $('qrBtn'), archiveBtn = $('archiveBtn');
let events = [], compact = null, song = null, code = '', seed = 1, player = null, idleSpin = 0;
let sourceInfo = {};

// one archive entry per visit to this page: remaking replaces it
const visitId = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const createdAt = new Date().toISOString();

function showMessage(text){ const m = $('message'); m.textContent = text; m.hidden = !text; }

function renderLegend(info){
  $('legend').innerHTML = ORDER.map(k => {
    const c = info[k] ? info[k].count : 0;
    return `<li class="${c ? '' : 'off'}"><span>${SOURCES[k].name}</span><span class="n">${c}</span><span class="dot" style="background:${SOURCES[k].color}"></span></li>`;
  }).join('');
}

function renderStats(info){
  const sessions = new Set(events.map(e => e.src + ':' + e.sess)).size;
  const froms = [...new Set(Object.values(info).map(i => i.from))];
  const where = froms.includes('server') ? '전시 서버 기록' : '이 브라우저 기록';
  $('stats').innerHTML = `소리 ${events.length.toLocaleString()}개 · 체험 ${sessions}회<br>` +
    (song ? `${song.bars}마디 · ${BPM} BPM · ${OC.fmt(song.length)}` : '') + `<br>${where}`;
}

function setNow(){
  if (!song) return;
  const t = player && player.playing ? player.time() : 0;
  const b = clamp(Math.floor(t / BAR), 0, song.bars - 1);
  $('chordName').textContent = OC.chordName(song.barInfo[b].chord);
  $('barCount').textContent = `${String(b + 1).padStart(2, '0')} / ${String(song.bars).padStart(2, '0')}`;
}

function fileName(){
  return `outer-chord-${createdAt.slice(0, 16).replace(/[:T-]/g, '')}.wav`;
}

async function make(){
  compact = compose(events, seed);
  song = OC.expand(compact);
  if (player) player.stop();
  player = OC.player(song, () => { playBtn.textContent = '▶ 재생'; });
  setNow();
  draw();
  code = await OC.encode(compact);
  // keep it in the archive (this visit's entry; a remake overwrites it)
  const counts = {};
  for (const k of ORDER) counts[k] = sourceInfo[k] ? sourceInfo[k].count : 0;
  OC.saveSong({
    id: visitId, createdAt, code,
    bars: song.bars, length: +song.length.toFixed(2),
    chord: OC.chordName(song.barInfo[0].chord),
    counts, sounds: events.length,
    sessions: new Set(events.map(e => e.src + ':' + e.sess)).size,
  });
}

function play(){ player.play(); playBtn.textContent = '■ 정지'; }
function stop(){ if (player) player.stop(); playBtn.textContent = '▶ 재생'; setNow(); draw(); }

playBtn.addEventListener('click', () => (player.playing ? stop() : play()));
remakeBtn.addEventListener('click', async () => {
  const was = player && player.playing;
  stop();
  seed = (Math.random() * 2 ** 31) | 0;
  await make();
  if (was) play();
});

// render the same schedule offline and hand it over as a 16-bit WAV
saveBtn.addEventListener('click', async () => {
  saveBtn.disabled = true;
  const label = saveBtn.textContent;
  saveBtn.textContent = '만드는 중…';
  try {
    OC.download(await OC.renderWav(song), fileName());
  } catch (err) {
    showMessage('파일을 만들지 못했습니다: ' + err.message);
    setTimeout(() => showMessage(''), 3000);
  }
  saveBtn.textContent = label;
  saveBtn.disabled = false;
});

// the song, packed into a code, rides in a QR code to the visitor's phone
qrBtn.addEventListener('click', () => {
  if (!code) return;
  try { OC.showQR(code, { title: `${OC.chordName(song.barInfo[0].chord)} — ${OC.fmt(song.length)}` }); }
  catch (err) { showMessage('QR 코드를 만들지 못했습니다: ' + err.message); setTimeout(() => showMessage(''), 3000); }
});
archiveBtn.addEventListener('click', () => { location.href = '../records/index.html'; });

/* The record turns on the same kind of hand-cranked clock as the index:
   frames held for a slightly different time each, around 24 a second. */
let nextFrame = 0;
function loop(ts){
  if (ts >= nextFrame) {
    nextFrame = ts + (1000 / 24) * (1 + (Math.random() * 2 - 1) * .15);
    if (!(player && player.playing)) idleSpin += .012;
    setNow();
    draw();
  }
  requestAnimationFrame(loop);
}

window.addEventListener('resize', resize);
resize();
requestAnimationFrame(loop);

/* Once the song is made the archive has done its job: everything collected
   is cleared so the index starts over from nothing — no record at the
   bottom, no sounds waiting — for the next person. The song itself stays in
   this page, so it can still be played, remade and saved from here, and it
   is kept in the song archive (records/).
   On the server nothing is lost: the files move to archive/<time>/. */
const LOCAL_KEYS = [
  'cattle-mutilation-sound-pending-v1',
  'drawn-groove/v1:memory',
  'noctiluca.soundlog.v1', 'noctiluca.soundqueue.v1',
  'notalien.soundmem', 'notalien.soundmem.pending',
  'tenshi.memory.v1',
];
async function resetAll(){
  let archived = null;
  if (onServer) {
    try {
      const r = await fetch('../api/reset', { method: 'POST' });
      if (r.ok) archived = (await r.json()).archive;
    } catch (_) { /* static hosting: only this browser's copies to clear */ }
  }
  for (const k of LOCAL_KEYS) { try { localStorage.removeItem(k); } catch (_) {} }
  try { sessionStorage.removeItem('xg.visited'); } catch (_) {}
  return archived;
}

(async () => {
  const { events: evs, info } = await collect();
  events = evs;
  sourceInfo = info;
  renderLegend(info);
  if (!events.length) {
    await resetAll();
    renderStats(info);
    showMessage('아직 모인 소리가 없습니다.\n작품을 체험한 뒤 다시 와 주세요.');
    $('message').style.whiteSpace = 'pre-line';
    archiveBtn.disabled = false;
    return;
  }
  seed = (Math.random() * 2 ** 31) | 0;
  await make();
  renderStats(info);
  [playBtn, remakeBtn, saveBtn, qrBtn, archiveBtn].forEach(b => (b.disabled = false));
  await resetAll();
  $('stats').insertAdjacentHTML('beforeend', '<br>이 곡을 만든 소리는 비워졌습니다');
})();

})();
</script>
